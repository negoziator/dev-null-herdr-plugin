id = "negoziator.dev-null"
name = "/dev/null"
version = "0.3.0"
min_herdr_version = "0.7.4"
description = "Post to /dev/null (dev-null.sh) from herdr: a popup composer, and your feed in a pane."
platforms = ["linux", "macos"]

# Panes run with the plugin directory as their working directory.
[[panes]]
id = "compose"
title = "/dev/null post"
placement = "popup"
width = 84
height = 26
command = ["python3", "bin/devnull", "compose"]

[[actions]]
id = "compose"
title = "Post to /dev/null"
description = "Write a post and post it to /dev/null."
command = ["python3", "bin/devnull", "open", "compose"]

# The feed: Following, Latest, Trending and notifications, next to your agents.
[[panes]]
id = "feed"
title = "/dev/null feed"
placement = "split"
command = ["python3", "bin/devnull", "feed"]

# A reply to the post picked in the feed.
[[panes]]
id = "reply"
title = "/dev/null reply"
placement = "popup"
width = 84
height = 26
command = ["python3", "bin/devnull", "compose", "--pending-reply"]

[[actions]]
id = "feed"
title = "Open /dev/null feed"
description = "Show your /dev/null feed in a pane. Signs you in the first time."
command = ["python3", "bin/devnull", "open", "feed"]

# Checks your unread count once a minute, in the background, and tells you when it grows.
[[startup]]
command = ["python3", "bin/devnull", "watch", "--detach"]
